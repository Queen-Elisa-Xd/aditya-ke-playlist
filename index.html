<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aditya Ke Playlist</title>
<meta name="theme-color" content="#1A1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F5EFE4;
    --muted: rgba(245,239,228,0.68);
    --faint: rgba(245,239,228,0.4);
    --glass-border: rgba(255,255,255,0.22);
    --accent: #E8C468;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      linear-gradient(rgba(20,14,8,0.5), rgba(20,14,8,0.6)),
      url('bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--cream);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content: flex-end;
    padding: 24px 16px 40px;
  }

  .top-space{ flex: 1; min-height: 40px; }

  /* ---- Glass pill player ---- */
  .player-card{
    width: min(640px, 100%);
    background: rgba(255,255,255,0.09);
    border: 1px solid var(--glass-border);
    border-radius: 40px;
    padding: 18px 22px;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.5);
  }

  .player-row{
    display:flex;
    align-items:center;
    gap: 16px;
  }

  .art{
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid var(--glass-border);
    flex-shrink: 0;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 22px;
  }
  .art img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:none;
  }

  .meta{
    flex: 1;
    min-width: 0;
  }
  .meta .track-title{
    font-weight: 600;
    font-size: 17px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0 0 2px;
  }
  .meta .track-sub{
    font-size: 13px;
    color: var(--muted);
    margin: 0;
  }

  .controls{
    display:flex;
    align-items:center;
    gap: 8px;
    flex-shrink: 0;
  }
  .ctrl-btn{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .ctrl-btn:hover{ background: rgba(255,255,255,0.18); }
  .ctrl-btn:active{ transform: scale(0.93); }
  .ctrl-btn.play{
    width: 48px;
    height: 48px;
    background: var(--cream);
    color: #241A0E;
  }
  .ctrl-btn.play:hover{ background: #fff; }
  .ctrl-btn svg{ width: 16px; height: 16px; }
  .ctrl-btn.play svg{ width: 18px; height: 18px; }

  .progress-row{
    display:flex;
    align-items:center;
    gap: 12px;
    margin-top: 14px;
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .progress-track{
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
    position: relative;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: var(--cream);
    border-radius: 2px;
    transition: width 0.3s linear;
  }

  .player-frame{
    width: 1px;
    height: 1px;
    overflow: hidden;
    position: absolute;
    left: -9999px;
  }

  footer{
    margin-top: 22px;
    text-align: center;
  }
  .name{
    font-weight: 600;
    font-size: 16px;
    color: var(--cream);
    margin-bottom: 8px;
  }
  .made-with{
    font-size: 12.5px;
    color: var(--faint);
    margin: 0 0 10px;
  }
  .socials{
    display:flex;
    gap: 18px;
    justify-content:center;
    flex-wrap: wrap;
  }
  .socials a{
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.03em;
    border-bottom: 1px solid transparent;
    transition: all 0.15s;
  }
  .socials a:hover{ color: var(--accent); border-color: var(--accent); }

  @media (max-width: 420px){
    .meta .track-title{ font-size: 15px; }
    .art{ width: 52px; height: 52px; }
    .ctrl-btn{ width: 36px; height: 36px; }
    .ctrl-btn.play{ width: 42px; height: 42px; }
  }
</style>
</head>
<body>

  <div class="top-space"></div>

  <div class="player-card">
    <div class="player-row">
      <div class="art" id="art"><span id="artEmoji">🎵</span><img id="artImg" alt=""></div>
      <div class="meta">
        <p class="track-title" id="trackTitle">Playlist load ho rahi hai...</p>
        <p class="track-sub" id="trackSub">Aditya Ke Playlist</p>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play" id="playBtn" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
        </button>
      </div>
    </div>
    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="durTime">0:00</span>
    </div>
    <div class="player-frame"><div id="ytPlayer"></div></div>
  </div>

  <footer>
    <div class="name">Aditya</div>
    <p class="made-with">Made with ❤️ @flexx_adiiiii</p>
    <div class="socials">
      <a href="https://www.instagram.com/flexx_adiiiii?igsh=MWFtdGVvZ3ZxeDZhYg==" target="_blank" rel="noopener">Instagram</a>
    </div>
  </footer>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const PLAYLIST_ID = 'PL0umg_TNpoZTTdZVIi5tfX69pRmoMFGna';

  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const trackTitle = document.getElementById('trackTitle');
  const trackSub = document.getElementById('trackSub');
  const art = document.getElementById('art');
  const artImg = document.getElementById('artImg');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const progressFill = document.getElementById('progressFill');

  let ytPlayer = null;
  let ytReady = false;
  let progressInterval = null;

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

  function fmtTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateProgress(){
    if (!ytPlayer || !ytPlayer.getCurrentTime) return;
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    curTime.textContent = fmtTime(cur);
    durTime.textContent = fmtTime(dur);
    progressFill.style.width = dur ? `${(cur/dur)*100}%` : '0%';
  }

  function onYouTubeIframeAPIReady(){
    ytReady = true;
    ytPlayer = new YT.Player('ytPlayer', {
      height: '100%',
      width: '100%',
      playerVars: { listType: 'playlist', list: PLAYLIST_ID },
      events: {
        onReady: () => {
          trackTitle.textContent = 'Horn daba... matlab play daba ke suno';
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING){
            playIcon.outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${ICON_PAUSE}</svg>`;
            const data = ytPlayer.getVideoData();
            if (data && data.title) trackTitle.textContent = data.title;
            if (data && data.video_id){
              artImg.src = `https://img.youtube.com/vi/${data.video_id}/default.jpg`;
              artImg.style.display = 'block';
              const emojiEl = document.getElementById('artEmoji');
              if (emojiEl) emojiEl.style.display = 'none';
            }
            if (!progressInterval) progressInterval = setInterval(updateProgress, 500);
          } else if (e.data === YT.PlayerState.PAUSED){
            playIcon.outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${ICON_PLAY}</svg>`;
          } else if (e.data === YT.PlayerState.ENDED){
            playIcon.outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${ICON_PLAY}</svg>`;
          }
          // refresh the reference after outerHTML swap
          window.playIconRef = document.getElementById('playIcon');
        }
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  playBtn.addEventListener('click', () => {
    if (!ytReady || !ytPlayer || !ytPlayer.getPlayerState) return;
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING){
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });

  prevBtn.addEventListener('click', () => {
    if (ytPlayer && ytPlayer.previousVideo) ytPlayer.previousVideo();
  });
  nextBtn.addEventListener('click', () => {
    if (ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo();
  });
</script>

</body>
</html>
