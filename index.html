<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aditya Ke Playlist</title>
<meta name="theme-color" content="#1A1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family: 'AMS Deepak';
    src: url('AMS_Deepak.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --cream: #F5EFE4;
    --muted: rgba(245,239,228,0.68);
    --faint: rgba(245,239,228,0.42);
    --glass-border: rgba(255,255,255,0.28);
    --accent: #E8C468;
    --green: #3DDC84;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:
      linear-gradient(rgba(20,14,8,0.5), rgba(20,14,8,0.6)),
      url('bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--cream);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ---- Center: Hindi name in AMS Deepak font ---- */
  .center-name{
    position: fixed;
    bottom: 250px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'AMS Deepak', 'Yatra One', cursive;
    font-size: clamp(20px, 5.5vw, 34px);
    color: #FFD700;
    text-shadow: 0 4px 20px rgba(0,0,0,0.65), 0 2px 6px rgba(0,0,0,0.5);
    z-index: 1;
    pointer-events: none;
    text-align: center;
    line-height: 1;
  }

  /* ---- Top-left: date/time ---- */
  .top-left-time{
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    font-size: 11.5px;
    color: var(--faint);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    z-index: 2;
  }

  /* ---- Top-center: live dot + online count ---- */
  .live-badge{
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    white-space: nowrap;
    z-index: 2;
  }
  .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px 1px rgba(61,220,132,0.7);
    flex-shrink: 0;
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  @keyframes pulse-dot{
    0%, 100%{ opacity:1; transform: scale(1); }
    50%{ opacity:0.55; transform: scale(0.85); }
  }

  /* ---- Bottom-center stack: player card + credit block ---- */
  .bottom-stack{
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 3;
  }

  .player-card{
    position: relative;
    width: min(272px, 84vw);
    overflow: hidden;
    background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04) 60%, rgba(255,255,255,0.1));
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 12px 14px 12px;
    backdrop-filter: blur(26px) saturate(160%);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    box-shadow:
      0 12px 40px -12px rgba(0,0,0,0.55),
      inset 0 1px 1px rgba(255,255,255,0.45),
      inset 0 -1px 1px rgba(0,0,0,0.18);
  }
  .player-card::before{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:220%; height:100%;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.14) 50%, transparent 58%);
    pointer-events:none;
  }
  .player-card::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius: 22px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    pointer-events:none;
  }

  .player-row{
    display:flex;
    align-items:center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .art{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid var(--glass-border);
    flex-shrink: 0;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 15px;
    animation: spin 7s linear infinite;
    animation-play-state: paused;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }
  .art img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:none;
  }

  .meta{
    flex: 1;
    min-width: 0;
  }
  .meta .track-title{
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0 0 2px;
  }
  .meta .track-sub{
    font-size: 10.5px;
    color: var(--muted);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .controls{
    display:flex;
    align-items:center;
    gap: 5px;
    flex-shrink: 0;
  }
  .ctrl-btn{
    width: 29px;
    height: 29px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .ctrl-btn:hover{ background: rgba(255,255,255,0.18); }
  .ctrl-btn:active{ transform: scale(0.93); }
  .ctrl-btn.play{
    width: 34px;
    height: 34px;
    background: var(--cream);
    color: #241A0E;
  }
  .ctrl-btn.play:hover{ background: #fff; }
  .ctrl-btn svg{ width: 11px; height: 11px; }
  .ctrl-btn.play svg{ width: 13px; height: 13px; }

  .progress-row{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-top: 9px;
    font-size: 9px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    position: relative;
    z-index: 1;
  }
  .progress-track{
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
    position: relative;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: var(--cream);
    border-radius: 2px;
    transition: width 0.3s linear;
  }

  .player-frame{
    width: 1px;
    height: 1px;
    overflow: hidden;
    position: absolute;
    left: -9999px;
  }

  /* ---- Credit + Instagram link, below player card ---- */
  .credit-block{
    text-align: center;
  }
  .made-with{
    font-size: 11px;
    color: var(--muted);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    margin: 0 0 6px;
  }
  .insta-link{
    display:inline-flex;
    align-items:center;
    gap: 6px;
    text-decoration: none;
    color: var(--cream);
    font-size: 12px;
    font-weight: 500;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    padding: 6px 12px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.15s;
  }
  .insta-link:hover{ background: rgba(255,255,255,0.18); }
  .insta-link svg{ width: 14px; height: 14px; flex-shrink: 0; }

  /* ---- Rotating captions, between name and player card ---- */
  .caption-strip{
    position: fixed;
    bottom: 205px;
    left: 50%;
    width: min(272px, 84vw);
    text-align: center;
    color: #000;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.35;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transform: translateX(-50%) translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .caption-strip.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 420px){
    .center-name{ font-size: 7vw; }
    .top-left-time{ font-size: 10px; }
    .live-badge{ font-size: 10px; }
    .caption-strip{ bottom: 190px; font-size: 11.5px; }
  }
</style>
</head>
<body>

  <div class="center-name">आदित्य</div>

  <div class="caption-strip" id="captionStrip"></div>

  <div class="top-left-time" id="istTime">--:--</div>

  <div class="live-badge">
    <span class="dot"></span>
    <span id="onlineCount">-- online</span>
  </div>

  <div class="bottom-stack">
    <div class="player-card">
      <div class="player-row">
        <div class="art" id="art"><span id="artEmoji">🎵</span><img id="artImg" alt=""></div>
        <div class="meta">
          <p class="track-title" id="trackTitle">Playlist load ho rahi hai...</p>
          <p class="track-sub" id="trackSub"></p>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn play" id="playBtn" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="nextBtn" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-2 6L5.5 6v12z"/></svg>
          </button>
        </div>
      </div>
      <div class="progress-row">
        <span id="curTime">0:00</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span id="durTime">0:00</span>
      </div>
      <div class="player-frame"><div id="ytPlayer"></div></div>
    </div>

    <div class="credit-block">
      <p class="made-with">Made with ❤️ Aditya</p>
      <a class="insta-link" href="https://www.instagram.com/flexx_adiiiii?igsh=MWFtdGVvZ3ZxeDZhYg==" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.13 1.39C1.35 2.68.94 3.35.63 4.14.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.39 2.13.67.67 1.34 1.08 2.13 1.39.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56.79-.31 1.46-.72 2.13-1.39.67-.67 1.08-1.34 1.39-2.13.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91-.31-.79-.72-1.46-1.39-2.13C21.32 1.35 20.65.94 19.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zm0 10.16A4 4 0 1 1 16 12a4 4 0 0 1-4 4zm6.41-10.6a1.44 1.44 0 1 1-1.44-1.44 1.44 1.44 0 0 1 1.44 1.44z"/></svg>
        <span>@flexx_adiiiii</span>
      </a>
    </div>
  </div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const PLAYLIST_ID = 'PL0umg_TNpoZTTdZVIi5tfX69pRmoMFGna';

  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const trackTitle = document.getElementById('trackTitle');
  const trackSub = document.getElementById('trackSub');
  const art = document.getElementById('art');
  const artImg = document.getElementById('artImg');
  const artEmoji = document.getElementById('artEmoji');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const progressFill = document.getElementById('progressFill');
  const istTimeEl = document.getElementById('istTime');
  const onlineCountEl = document.getElementById('onlineCount');
  const captionStrip = document.getElementById('captionStrip');

  const captions = [
    "Apna time aayega,\ntab tak play next karo",
    "Dil se jio, duniya ki chhodo",
    "Life is short, chai has to be strong.",
    "Sab kuch theek hoga,\nfilhaal picture meri perfect hai",
    "Apni marzi ka jeevan,\nno explanations needed",
    "Not everyone gets me,\nand that is completely fine",
    "Apni league mein akela hoon",
    "Zero drama, sirf real energy",
    "Diet kal se aaj ke liye,\npizza book kar do",
    "Gym jaana tha, biryani kha li,\nsame energy hai",
    "Bank balance kam, confidence full",
    "Koi interested ladki hi,\nmujhe DM kare, for pyaar 🤧",
    "Dil diya toh,\ndeal pakki hai madam ji"
  ];
  let captionIndex = 0;

  function showCaption(i){
    captionStrip.classList.remove('show');
    setTimeout(() => {
      captionStrip.innerHTML = captions[i].replace(/\n/g, '<br>');
      captionStrip.classList.add('show');
    }, 300);
  }
  showCaption(captionIndex);
  setInterval(() => {
    captionIndex = (captionIndex + 1) % captions.length;
    showCaption(captionIndex);
  }, 7000);

  let ytPlayer = null;
  let ytReady = false;
  let progressInterval = null;

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

  function fmtTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateProgress(){
    if (!ytPlayer || !ytPlayer.getCurrentTime) return;
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    curTime.textContent = fmtTime(cur);
    durTime.textContent = fmtTime(dur);
    progressFill.style.width = dur ? `${(cur/dur)*100}%` : '0%';
  }

  function updateMeta(data){
    if (!data) return;
    if (data.title) trackTitle.textContent = data.title;
    trackSub.textContent = data.author ? data.author : '';
    if (data.video_id){
      artImg.src = `https://img.youtube.com/vi/${data.video_id}/default.jpg`;
      artImg.style.display = 'block';
      if (artEmoji) artEmoji.style.display = 'none';
    }
  }

  function setSpinning(isSpinning){
    art.style.animationPlayState = isSpinning ? 'running' : 'paused';
  }

  /* ---- Live IST clock (top-left) ---- */
  function updateISTTime(){
    const now = new Date();
    const formatted = new Intl.DateTimeFormat('en-IN', {
      timeZone: 'Asia/Kolkata',
      day: '2-digit',
      month: 'short',
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    }).format(now);
    istTimeEl.textContent = formatted;
  }
  updateISTTime();
  setInterval(updateISTTime, 15000);

  /* ---- Simulated live online-user count (top-center) ---- */
  let onlineBase = Math.floor(Math.random() * 30) + 15; // 15-44
  function tickOnline(){
    onlineBase += Math.floor(Math.random() * 3) - 1; // -1, 0, or +1
    if (onlineBase < 3) onlineBase = 3;
    onlineCountEl.textContent = `${onlineBase} online`;
  }
  tickOnline();
  setInterval(tickOnline, 5000);

  function onYouTubeIframeAPIReady(){
    ytReady = true;
    ytPlayer = new YT.Player('ytPlayer', {
      height: '100%',
      width: '100%',
      playerVars: { listType: 'playlist', list: PLAYLIST_ID },
      events: {
        onReady: () => {
          const data = ytPlayer.getVideoData ? ytPlayer.getVideoData() : null;
          updateMeta(data);
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING){
            playIcon.outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${ICON_PAUSE}</svg>`;
            updateMeta(ytPlayer.getVideoData());
            setSpinning(true);
            if (!progressInterval) progressInterval = setInterval(updateProgress, 500);
          } else if (e.data === YT.PlayerState.PAUSED){
            playIcon.outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${ICON_PLAY}</svg>`;
            setSpinning(false);
          } else if (e.data === YT.PlayerState.ENDED){
            playIcon.outerHTML = `<svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">${ICON_PLAY}</svg>`;
            setSpinning(false);
          }
          // refresh the reference after outerHTML swap
          window.playIconRef = document.getElementById('playIcon');
        }
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  playBtn.addEventListener('click', () => {
    if (!ytReady || !ytPlayer || !ytPlayer.getPlayerState) return;
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING){
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });

  prevBtn.addEventListener('click', () => {
    if (ytPlayer && ytPlayer.previousVideo) ytPlayer.previousVideo();
  });
  nextBtn.addEventListener('click', () => {
    if (ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo();
  });
</script>

</body>
</html>
